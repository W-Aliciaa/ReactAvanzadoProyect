name: CI

on:
  push:
    branches: [main, clase-6-preparacion]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marketplace
  JWT_SECRET: ci-only-secret-with-at-least-32-characters

jobs:
  quality:
    name: Unit, lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run test:run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  browser:
    name: Production smoke and Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: marketplace
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            marketplace/playwright-report/
            marketplace/test-results/
          if-no-files-found: ignore
